    <style>
        @font-face {
            font-family: 'Tropical';
            src: url('Tropical\ Avenue\ Personal\ Use\ Only.ttf') format('truetype');

            /*Tipos de format() 

                - opentype (otf)

        }

            font-size: 3em;
        }
