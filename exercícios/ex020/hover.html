<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #E7F2E4;
        }

        div > p{
            display: none;
        }

        div:hover > p{
            display: block;
            color: white;
            background-color: red;
        }


        div{
            background-color: #80BF41;
            height: 50px;
            width: 150px;
            text-align: center;
            padding: 50px;
            border: 1px solid black;

        }

        div:hover{
            color: red;
        }


    </style>
</head>
<body>
    <h1>Exemplo de hover</h1>
    <p>Passe o mouse sobre o texto abaixo</p>

    <div>
    Passe o mouse aqui
    <p>Texto escondido...</p>
    </div>
    
</body>
</html>
